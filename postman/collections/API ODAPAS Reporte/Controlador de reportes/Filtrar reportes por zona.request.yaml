$kind: http-request
url: "{{urlBase}}/api/reportes?zona=ZC"
method: GET
queryParams:
  zona: ZC
scripts:
  - type: afterResponse
    code: |-
      pm.test("Respuesta con estado 200", () => pm.response.to.have.status(200));
      pm.test("Solo reportes de Zona Centro", () => pm.response.json().forEach(r => pm.expect(r.zona).to.eql("ZC")));
    language: text/javascript
order: 3000

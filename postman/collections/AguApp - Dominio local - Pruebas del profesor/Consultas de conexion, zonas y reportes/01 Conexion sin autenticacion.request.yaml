$kind: http-request
url: "{{urlBase}}/api/publico/documentos"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Estado 200", () => pm.response.to.have.status(200));
      pm.test("Respuesta JSON", () => pm.response.json());
    language: text/javascript
order: 1000

$kind: http-request
url: "{{urlBase}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "email": "{{adminEmail}}", "password": "{{adminPassword}}" }'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login administrador",()=>pm.response.to.have.status(200));
      if(pm.response.code===200) pm.collectionVariables.set("token",pm.response.json().token);
    language: text/javascript
order: 8000

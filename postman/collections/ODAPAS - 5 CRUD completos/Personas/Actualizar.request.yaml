$kind: http-request
url: "{{urlBase}}/api/personas/{{personaId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre_completo": "Persona prueba Postman actualizado"
    }
scripts:
  - type: afterResponse
    code: pm.test("Estado 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000

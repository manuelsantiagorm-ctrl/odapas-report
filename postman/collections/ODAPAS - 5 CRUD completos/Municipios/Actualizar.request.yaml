$kind: http-request
url: "{{urlBase}}/api/municipios/{{municipioId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Municipio prueba Postman actualizado",
      "estado": "Estado de Mexico"
    }
scripts:
  - type: afterResponse
    code: pm.test("Estado 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000

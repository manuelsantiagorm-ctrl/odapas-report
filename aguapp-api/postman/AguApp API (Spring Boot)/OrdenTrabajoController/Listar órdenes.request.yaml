$kind: http-request
url: "{{baseUrl}}/api/ordenes-trabajo"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Una orden', () => pm.expect(pm.response.json().length).to.eql(1));
    language: text/javascript
order: 1000

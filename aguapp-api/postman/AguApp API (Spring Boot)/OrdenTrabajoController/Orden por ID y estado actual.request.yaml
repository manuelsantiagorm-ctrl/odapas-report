$kind: http-request
url: "{{baseUrl}}/api/ordenes-trabajo/ot1"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Estado reparada', () => pm.expect(pm.response.json().estado).to.eql('reparada'));
      pm.test('Origen r1', () => pm.expect(pm.response.json().reporteId).to.eql('r1'));
    language: text/javascript
order: 2000

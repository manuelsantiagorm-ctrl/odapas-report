$kind: http-request
url: "{{baseUrl}}/api/reportes?tipo=fuga"
method: GET
queryParams:
  tipo: fuga
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Solo fugas", () => pm.response.json().forEach(r => pm.expect(r.tipo).to.eql("fuga")));
    language: text/javascript
order: 2000

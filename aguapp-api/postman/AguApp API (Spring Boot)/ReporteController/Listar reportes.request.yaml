$kind: http-request
url: "{{baseUrl}}/api/reportes"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Regresa 3 reportes", () => pm.expect(pm.response.json().length).to.eql(3));
    language: text/javascript
order: 1000

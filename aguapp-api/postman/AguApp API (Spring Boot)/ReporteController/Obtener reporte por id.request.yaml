$kind: http-request
url: "{{baseUrl}}/api/reportes/r1"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Es r1", () => pm.expect(pm.response.json().id).to.eql("r1"));
    language: text/javascript
order: 3000

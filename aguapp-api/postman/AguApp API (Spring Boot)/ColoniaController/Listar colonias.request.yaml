$kind: http-request
url: "{{baseUrl}}/api/colonias"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Regresa 4 colonias", () => pm.expect(pm.response.json().length).to.eql(4));
    language: text/javascript
order: 1000


spring.application.name=api-odapas-reporte
server.port=8080
spring.jackson.serialization.indent-output=true

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/odapas_report}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# La API consulta la base existente; no instala ni vuelve a cargar el SQL.
spring.sql.init.mode=never

# --- ODAPAS Report: operación ---
# Modo demostración: los enlaces de verificación, recuperación y activación se muestran en pantalla
# (no hay servidor de correo en el proyecto escolar). En producción poner ODAPAS_MOSTRAR_ENLACES=false.
odapas.enlaces.mostrar=${ODAPAS_MOSTRAR_ENLACES:true}
odapas.url-frontend=${ODAPAS_URL_FRONTEND:http://localhost:4200}
# Carpeta donde se guardan las fotografías (fuera de la base de datos).
odapas.archivos.carpeta=${ODAPAS_ARCHIVOS:./archivos}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
server.error.include-message=never
server.error.include-stacktrace=never
